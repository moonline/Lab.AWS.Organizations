AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31

Description: Organization services like CloudTrail, Identity Center and SCPs

Parameters:
  environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment, e.g. dev for development
  identityCenterInstanceArn:
    Type: String
    AllowedPattern: (^$|^arn:aws:sso:::instance/(sso)?ins-[a-zA-Z0-9-.]{16})
    Description: >
      ARN of an IAM Identity Center, e.g. 'arn:aws:sso:::instance/ssoins-xxxxxxxxxxxxxxxx'.
      Find by `aws sso-admin list-instances`.
  identityStoreId:
    Type: String
    Description: ID of the Identity Store attached to the IAM Identity Center instance.
  supportedRegions:
    Type: String
    Description: >
      Comma separated list of supported regions. The first is the main region.
      See https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.RegionsAndAvailabilityZones.html.
      Examples:
      - us-east-1 # US East (N. Virginia)
      - sa-east-1 # South America (São Paulo)
      - eu-central-1 # Europe (Frankfurt)
      - eu-central-2 # Europe (Zurich)
      - ap-southeast-1 # Asia Pacific (Singapore)
      These regions must be enabled in the account: https://us-east-1.console.aws.amazon.com/billing/home?region=eu-central-1#/account?AWS-Regions
    Default: "us-east-1,eu-central-1"
  organizationStackName:
    Type: String
    Description: Organization stack name, used to import organization properties
  allAccountIds:
    Type: String
    Description: IDs of all accounts
  notificationEmails:
    Type: String
    Description: Email addresses where AWS notifications should be sent to. E.g. billing alarms

Resources:
  CustomResourcesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      Parameters:
        environment: !Ref environment
        organizationId:
          "Fn::ImportValue":
            "Fn::Sub": "${organizationStackName}:OrganizationId"
      TemplateURL: "./custom-resources/custom-resources.yml"
      TimeoutInMinutes: 10
      Tags:
        - Key: environment
          Value: !Ref environment
        - Key: application
          Value: aws-org
        - Key: component
          Value: custom-resources

  Variables:
    Type: Custom::EchoUtility
    Properties:
      ServiceToken: !GetAtt CustomResourcesStack.Outputs.EchoUtilityFunctionArn
      ServiceTimeout: 10
      organizationId:
        "Fn::ImportValue":
          "Fn::Sub": "${organizationStackName}:OrganizationId"
      managementAccountId:
        "Fn::ImportValue":
          "Fn::Sub": "${organizationStackName}:ManagementAccountId"
      organizationRootId:
        "Fn::ImportValue":
          "Fn::Sub": "${organizationStackName}:OrganizationRootId"
      securityAccountId:
        "Fn::ImportValue":
          "Fn::Sub": "${organizationStackName}:SecurityAccountId"

  LoggingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      Parameters:
        environment: !Ref environment
        managementAccountId: !GetAtt Variables.managementAccountId
        organizationId: !GetAtt Variables.organizationId
        organizationsAwsServiceAccessFunctionArn: !GetAtt CustomResourcesStack.Outputs.OrganizationsAwsServiceAccessFunctionArn
      TemplateURL: "./logging.yml"
      TimeoutInMinutes: 5
      Tags:
        - Key: environment
          Value: !Ref environment
        - Key: application
          Value: aws-org
        - Key: component
          Value: logging

  IdentityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      Parameters:
        environment: !Ref environment
        identityCenterInstanceArn: !Ref identityCenterInstanceArn
        identityStoreId: !Ref identityStoreId
        organizationId: !GetAtt Variables.organizationId
        organizationRootId: !GetAtt Variables.organizationRootId
        supportedRegions: !Ref supportedRegions
        securityAccountId: !GetAtt Variables.securityAccountId
        allAccountIds: !Ref allAccountIds
        organizationsAwsServiceAccessFunctionArn: !GetAtt CustomResourcesStack.Outputs.OrganizationsAwsServiceAccessFunctionArn
        cloudformationOrganizationsAccessFunctionArn: !GetAtt CustomResourcesStack.Outputs.CloudformationOrganizationsAccessFunctionArn
        organizationsDelegatedAdministratorFunctionArn: !GetAtt CustomResourcesStack.Outputs.OrganizationsDelegatedAdministratorFunctionArn
      TemplateURL: "./identity/identity.yml"
      TimeoutInMinutes: 10
      Tags:
        - Key: environment
          Value: !Ref environment
        - Key: application
          Value: aws-org
        - Key: component
          Value: identity

  ServiceControlPoliciesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      Parameters:
        environment: !Ref environment
        organizationRootId: !GetAtt Variables.organizationRootId
        supportedRegions: !Ref supportedRegions
        organizationsPolicyTypeFunctionArn: !GetAtt CustomResourcesStack.Outputs.OrganizationsPolicyTypeFunctionArn
      TemplateURL: "./service-control-policies.yml"
      TimeoutInMinutes: 10
      Tags:
        - Key: environment
          Value: !Ref environment
        - Key: application
          Value: aws-org
        - Key: component
          Value: policies

  CostManagementStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      Parameters:
        environment: !Ref environment
        notificationEmails: !Ref notificationEmails
      TemplateURL: "./cost-management.yml"
      TimeoutInMinutes: 5
      Tags:
        - Key: environment
          Value: !Ref environment
        - Key: application
          Value: aws-org
        - Key: component
          Value: cost-management

Outputs:
  PermissionSets:
    Description: Identity center permission sets
    Value: !GetAtt IdentityStack.Outputs.PermissionSets
  Groups:
    Description: Identity center groups
    Value: !GetAtt IdentityStack.Outputs.Groups
